name: Bug report
description: Something kdev did wrong, or a message that did not help.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: >
        The same command with `-v` (e.g. `kdev -v up`). It logs every Kaggle API
        call: check it for anything you would rather not share before pasting.
      render: text
  - type: input
    id: version
    attributes:
      label: kdev version
      description: "`kdev --version`"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26, Ubuntu 24.04, Windows 11…
    validations:
      required: true
