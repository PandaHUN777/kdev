name: Feature request
description: Something kdev could do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where kdev gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could work. A sketch of the command is plenty.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
